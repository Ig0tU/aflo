# AuditFlow — one command
#
#   docker compose up --build
#
# Serves API on :8000, writes workpaper to ./output
# Uses SQLite by default (no Postgres required).
# Optional Postgres: docker compose --profile postgres up --build

services:
  aflo:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite+aiosqlite:////app/data/aflo.db
      APP_ENV: production
      AFLO_RUN_DEMO: "1"
    volumes:
      - ./output:/app/output
      - ./data:/app/data:ro

  db:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aflo
      POSTGRES_PASSWORD: aflo
      POSTGRES_DB: aflo
    ports:
      - "5432:5432"
    volumes:
      - aflo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aflo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aflo_pgdata:
