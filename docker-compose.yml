services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aflo
      POSTGRES_PASSWORD: aflo
      POSTGRES_DB: aflo
    ports:
      - "5432:5432"
    volumes:
      - aflo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aflo"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  aflo_pgdata:
